name: Capture live demo screenshot

on:
  push:
    branches:
      - polish/recruiter-readme-final
    paths:
      - .github/workflows/capture-demo.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Capture current production demo
        run: |
          mkdir -p public/docs/screenshots
          npx --yes playwright@1.56.1 screenshot \
            --browser chromium \
            --viewport-size="1440,1000" \
            --wait-for-timeout=2500 \
            https://modelhawk.onrender.com/demo \
            public/docs/screenshots/03-audit-results.png

          python - <<'PY'
          from pathlib import Path
          import struct

          path = Path('public/docs/screenshots/03-audit-results.png')
          data = path.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Screenshot is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1440, 1000):
              raise SystemExit(f'Unexpected screenshot dimensions: {width}x{height}')
          if len(data) < 50_000:
              raise SystemExit(f'Screenshot is unexpectedly small: {len(data)} bytes')
          print(f'Captured {width}x{height} PNG: {len(data)} bytes')
          PY

      - name: Commit screenshot and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/capture-demo.yml
          git add public/docs/screenshots/03-audit-results.png
          git commit -m "Refresh live demo screenshot"
          git push origin HEAD:polish/recruiter-readme-final
