name: One-off upload copy fix

on:
  push:
    branches:
      - polish/live-demo-credibility

permissions:
  contents: write

jobs:
  fix-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply exact copy fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/upload/page.tsx")
          text = path.read_text(encoding="utf-8")
          old = "technical audit checks and then uses a AI examiner layer to"
          new = "technical audit checks and then uses an AI examiner layer to"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one copy target, found {count}")

          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/upload/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix upload page grammar"
          git push origin HEAD:${GITHUB_REF_NAME}
