name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Production container smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --pull --tag modelhawk:ci .

      - name: Start production container
        run: docker run --detach --name modelhawk-ci --publish 3000:3000 modelhawk:ci

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/tmp/modelhawk-health.json; then
              cat /tmp/modelhawk-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs modelhawk-ci
          exit 1

      - name: Verify LaTeX runtime
        run: docker exec modelhawk-ci pdflatex --version

      - name: Exercise audit, examiner and PDF endpoints
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -F "file=@public/examples/credit_card_fraud_detection.ipynb;filename=credit_card_fraud_detection.ipynb" \
            http://127.0.0.1:3000/api/audit \
            -o /tmp/modelhawk-audit.json

          python - <<'PY'
          import json

          with open('/tmp/modelhawk-audit.json', encoding='utf-8') as handle:
              audit = json.load(handle)

          expected_scores = {
              'leakageRisk': 75,
              'metricQuality': 76,
              'reproducibility': 90,
              'portfolioReadiness': 79,
          }

          if audit.get('scores') != expected_scores:
              raise SystemExit(
                  f"Unexpected bundled-fixture scores: {audit.get('scores')} != {expected_scores}"
              )

          if len(audit.get('findings', [])) < 4:
              raise SystemExit('Expected the bundled regression fixture to produce at least four findings')
          PY

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/modelhawk-audit.json \
            http://127.0.0.1:3000/api/audit/ai \
            -o /tmp/modelhawk-ai.json

          python - <<'PY'
          import json

          with open('/tmp/modelhawk-audit.json', encoding='utf-8') as handle:
              audit = json.load(handle)
          with open('/tmp/modelhawk-ai.json', encoding='utf-8') as handle:
              examiner = json.load(handle)

          if examiner.get('provider') != 'deterministic':
              raise SystemExit(f"Expected deterministic CI examiner, got {examiner.get('provider')}")

          narrative = examiner.get('aiNarrative')
          required = {
              'executiveSummary',
              'technicalAssessment',
              'riskInterpretation',
              'portfolioVerdict',
              'improvedRecommendations',
              'suggestedMarkdownCells',
              'vivaAnswers',
              'limitations',
          }

          if not isinstance(narrative, dict) or not required.issubset(narrative):
              raise SystemExit('Examiner endpoint returned an incomplete controlled narrative')

          if len(narrative.get('vivaAnswers', [])) != len(audit.get('vivaQuestions', [])):
              raise SystemExit('Examiner did not preserve one answer per deterministic viva question')

          with open('/tmp/modelhawk-pdf-payload.json', 'w', encoding='utf-8') as handle:
              json.dump({'auditResult': audit, 'aiNarrative': narrative}, handle)
          PY

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/modelhawk-pdf-payload.json \
            http://127.0.0.1:3000/api/report/pdf \
            -o /tmp/modelhawk-report.pdf

          python - <<'PY'
          from pathlib import Path

          report = Path('/tmp/modelhawk-report.pdf').read_bytes()

          if not report.startswith(b'%PDF-'):
              raise SystemExit('PDF route did not return a PDF document')

          if b'%%EOF' not in report[-1024:]:
              raise SystemExit('PDF route returned a truncated PDF document')

          if len(report) < 10_000:
              raise SystemExit(f'PDF output is unexpectedly small: {len(report)} bytes')

          print(f'PDF smoke test passed: {len(report)} bytes')
          PY

      - name: Verify invalid API requests fail closed
        shell: bash
        run: |
          set -euo pipefail

          printf 'not a notebook' >/tmp/modelhawk-invalid.txt
          status=$(curl --silent --show-error -o /tmp/modelhawk-invalid-audit.json -w '%{http_code}' \
            -F "file=@/tmp/modelhawk-invalid.txt;filename=invalid.txt" \
            http://127.0.0.1:3000/api/audit)
          test "$status" = "400"
          grep -q 'Please upload a .ipynb notebook file.' /tmp/modelhawk-invalid-audit.json

          status=$(curl --silent --show-error -o /tmp/modelhawk-invalid-ai.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"fileName":"invalid.ipynb","scores":{"leakageRisk":999,"metricQuality":1,"reproducibility":1,"portfolioReadiness":1}}' \
            http://127.0.0.1:3000/api/audit/ai)
          test "$status" = "400"

          status=$(curl --silent --show-error -o /tmp/modelhawk-invalid-pdf.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"fileName":"invalid.ipynb"}' \
            http://127.0.0.1:3000/api/report/pdf)
          test "$status" = "400"

      - name: Verify runtime security headers
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --head http://127.0.0.1:3000/ >/tmp/modelhawk-headers.txt
          grep -qi '^content-security-policy:' /tmp/modelhawk-headers.txt
          grep -qi '^strict-transport-security:' /tmp/modelhawk-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/modelhawk-headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/modelhawk-headers.txt

      - name: Show container logs on failure
        if: failure()
        run: docker logs modelhawk-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force modelhawk-ci || true
