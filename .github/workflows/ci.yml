name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Production container smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --pull --tag modelhawk:ci .

      - name: Start production container
        run: docker run --detach --name modelhawk-ci --publish 3000:3000 modelhawk:ci

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/tmp/modelhawk-health.json; then
              cat /tmp/modelhawk-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs modelhawk-ci
          exit 1

      - name: Verify LaTeX runtime
        run: docker exec modelhawk-ci pdflatex --version

      - name: Exercise audit and PDF endpoints
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -F "file=@public/examples/credit_card_fraud_detection.ipynb;filename=credit_card_fraud_detection.ipynb" \
            http://127.0.0.1:3000/api/audit \
            -o /tmp/modelhawk-audit.json

          python - <<'PY'
          import json

          with open('/tmp/modelhawk-audit.json', encoding='utf-8') as handle:
              audit = json.load(handle)

          expected_scores = {
              'leakageRisk': 75,
              'metricQuality': 76,
              'reproducibility': 90,
              'portfolioReadiness': 79,
          }

          if audit.get('scores') != expected_scores:
              raise SystemExit(
                  f"Unexpected bundled-fixture scores: {audit.get('scores')} != {expected_scores}"
              )

          if len(audit.get('findings', [])) < 4:
              raise SystemExit('Expected the bundled regression fixture to produce at least four findings')

          with open('/tmp/modelhawk-pdf-payload.json', 'w', encoding='utf-8') as handle:
              json.dump({'auditResult': audit}, handle)
          PY

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/modelhawk-pdf-payload.json \
            http://127.0.0.1:3000/api/report/pdf \
            -o /tmp/modelhawk-report.pdf

          python - <<'PY'
          from pathlib import Path

          report = Path('/tmp/modelhawk-report.pdf').read_bytes()

          if not report.startswith(b'%PDF-'):
              raise SystemExit('PDF route did not return a PDF document')

          if b'%%EOF' not in report[-1024:]:
              raise SystemExit('PDF route returned a truncated PDF document')

          if len(report) < 10_000:
              raise SystemExit(f'PDF output is unexpectedly small: {len(report)} bytes')

          print(f'PDF smoke test passed: {len(report)} bytes')
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs modelhawk-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force modelhawk-ci || true
